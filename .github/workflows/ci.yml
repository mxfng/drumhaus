name: CI

on:
  push:
    branches: [main, v1.1-dev]
  pull_request:
    branches: [main, v1.1-dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter drumhaus exec playwright install chromium --with-deps

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Verify default build ships without LINK
        # LINK ships dark: a build without VITE_ENABLE_LINK must exclude the
        # session code path entirely (the wire key only exists inside it).
        run: |
          if grep -rq "haus:conductor" apps/drumhaus/dist/assets; then
            echo "LINK code path leaked into a default (flag-off) build"
            exit 1
          fi

      - name: Lightshow cold-load smoke check
        run: pnpm smoke:lightshow

      - name: Rebuild drumhaus with LINK for E2E
        run: VITE_ENABLE_LINK=true pnpm --filter drumhaus build

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Run family E2E tests
        run: pnpm test:e2e:family

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/drumhaus/playwright-report/
            apps/drumhaus/test-results/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
